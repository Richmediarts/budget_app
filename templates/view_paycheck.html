{% extends "base.html" %}

{% block title %}Paycheck #{{ paycheck.id }} - Budget Tracker{% endblock %}
{% block page_title %}Paycheck Details{% endblock %}

{% block content %}
<div class="row">
    <div class="col-12">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <a href="{{ url_for('paychecks') }}" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left"></i> Back to Paychecks
            </a>
            <div>
                <a href="{{ url_for('edit_paycheck', id=paycheck.id) }}" class="btn btn-primary">
                    <i class="bi bi-pencil"></i> Edit
                </a>
                <a href="{{ url_for('delete_paycheck', id=paycheck.id) }}" class="btn btn-danger" onclick="return confirm('Delete this paycheck?')">
                    <i class="bi bi-trash"></i> Delete
                </a>
            </div>
        </div>

        {% set pc = paycheck %}
        {% include 'paystub_template.html' %}
    </div>
</div>
{% endblock %}
