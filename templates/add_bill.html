{% extends "base.html" %}

{% block title %}Add Bill - Budget Tracker{% endblock %}
{% block page_title %}Add New Bill{% endblock %}

{% block content %}
<div class="row">
    <div class="col-lg-6 mx-auto">
        <div class="card">
            <div class="card-header">
                <h5><i class="bi bi-plus-circle"></i> Add New Bill</h5>
            </div>
            <div class="card-body">
                <form action="{{ url_for('add_bill') }}" method="POST">
                    <div class="mb-3">
                        <label class="form-label">Payee</label>
                        <div class="input-group">
                            <select name="payee_id" class="form-select" id="payeeSelect">
                                <option value="">-- Select Payee --</option>
                                {% for payee in payees %}
                                    <option value="{{ payee.id }}">{{ payee.name }} ({{ payee.category or 'Uncategorized' }})</option>
                                {% endfor %}
                            </select>
                            <button type="button" class="btn btn-outline-secondary" data-bs-toggle="modal" data-bs-target="#addPayeeModal">
                                <i class="bi bi-plus-circle"></i> New
                            </button>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Budget Category (optional)</label>
                        <select name="category_id" class="form-select">
                            <option value="">-- Select Category --</option>
                            {% for cat in category_options %}
                                <option value="{{ cat.id }}">{{ cat.display }}</option>
                            {% endfor %}
                        </select>
                        <small class="text-muted">Link this bill to a budget category for tracking</small>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Amount Due</label>
                        <div class="input-group">
                            <span class="input-group-text">$</span>
                            <input type="number" step="0.01" name="amount" class="form-control" required placeholder="0.00">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Due Date</label>
                        <input type="date" name="due_date" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="is_recurring" id="is_recurring" value="1">
                            <label class="form-check-label" for="is_recurring">Recurring Bill</label>
                        </div>
                    </div>
                    <div class="mb-3" id="recurrence_type_container" style="display: none;">
                        <label class="form-label">Recurrence</label>
                        <select name="recurrence_type" class="form-select">
                            <option value="weekly">Weekly</option>
                            <option value="biweekly">Biweekly</option>
                            <option value="monthly" selected>Monthly</option>
                            <option value="yearly">Yearly</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Account</label>
                        <select name="account" class="form-select">
                            <option value="">-- Select Account --</option>
                            {% for acct in bank_accounts %}
                                <option value="{{ acct.name }}">{{ acct.name }}{% if acct.institution %} ({{ acct.institution }}){% endif %}</option>
                            {% endfor %}
                            <option value="Auto draft">Auto draft</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Notes</label>
                        <textarea name="notes" class="form-control" rows="3" placeholder="Optional notes..."></textarea>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary flex-grow-1"><i class="bi bi-save"></i> Add Bill</button>
                        <a href="{{ url_for('bills') }}" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="addPayeeModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><i class="bi bi-person-plus"></i> Add New Payee</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label">Name</label>
                    <input type="text" id="newPayeeName" class="form-control" required placeholder="Company or person name">
                </div>
                <div class="mb-3">
                    <label class="form-label">Category</label>
                    <select id="newPayeeCategory" class="form-select">
                        <option value="">-- Select Category --</option>
                        <option value="utilities">Utilities</option>
                        <option value="rent">Rent/Mortgage</option>
                        <option value="insurance">Insurance</option>
                        <option value="subscriptions">Subscriptions</option>
                        <option value="phone">Phone/Internet</option>
                        <option value="medical">Medical</option>
                        <option value="auto">Auto/Transportation</option>
                        <option value="other">Other</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-primary" id="savePayeeBtn"><i class="bi bi-save"></i> Save Payee</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('is_recurring').addEventListener('change', function() {
    document.getElementById('recurrence_type_container').style.display = this.checked ? 'block' : 'none';
});

document.getElementById('savePayeeBtn').addEventListener('click', async function() {
    const name = document.getElementById('newPayeeName').value.trim();
    const category = document.getElementById('newPayeeCategory').value;
    
    if (!name) {
        alert('Please enter a payee name');
        return;
    }
    
    const formData = new FormData();
    formData.append('name', name);
    formData.append('category', category);
    
    try {
        const response = await fetch('/add_payee_ajax', {
            method: 'POST',
            body: formData
        });
        const data = await response.json();
        
        if (data.success) {
            const select = document.getElementById('payeeSelect');
            const option = document.createElement('option');
            option.value = data.payee_id;
            option.textContent = name + (category ? ' (' + category + ')' : ' (Uncategorized)');
            option.selected = true;
            select.appendChild(option);
            
            const modal = bootstrap.Modal.getInstance(document.getElementById('addPayeeModal'));
            modal.hide();
            document.getElementById('newPayeeName').value = '';
            document.getElementById('newPayeeCategory').value = '';
        } else {
            alert(data.error || 'Failed to add payee');
        }
    } catch (err) {
        alert('Error: ' + err.message);
    }
});
</script>
{% endblock %}
